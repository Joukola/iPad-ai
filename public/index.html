<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>iPad AI – puhetesti</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>iPad AI</h1>
    <p class="lead">Monikielinen tekstistä puheeksi -testi</p>

    <div id="face" class="face" aria-hidden="true">
      <div class="eyes">
        <span class="eye"></span>
        <span class="eye"></span>
      </div>
      <div class="mouth"></div>
    </div>

    <div class="languages" role="group" aria-label="Kieli">
      <button type="button" class="lang active" data-lang="fi-FI">Suomi</button>
      <button type="button" class="lang" data-lang="en-US">English</button>
      <button type="button" class="lang" data-lang="hu-HU">Magyar</button>
    </div>

    <label for="text">Luettava teksti</label>
    <textarea id="text">Hei. Tämä on iPadin oma tekstistä puheeksi -testi.</textarea>

    <button id="speak" class="primary" type="button">Puhu</button>
    <button id="stop" class="secondary" type="button">Pysäytä</button>

    <div id="status" class="status">Valmis.</div>

    <p class="note">
      Sivulla ei ladata ääniluetteloa. Se käyttää suoraan iPadin/Safarin omaa
      puhesynteesiä valitulla kielitunnisteella.
    </p>
  </main>

  <script src="tts.js"></script>
  <script src="app.js"></script>
</body>
</html>
