<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>iPad AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1>iPad AI</h1>
  <div id="stateLabel" class="state-label">Kuuntelee</div>

  <div id="avatar" class="avatar listening" aria-label="AI-hahmo">
    <div class="head">
      <div class="scarf"></div>
      <div class="hair hair-left"></div><div class="hair hair-right"></div>
      <div class="face-skin">
        <div class="brows"><i></i><i></i></div>
        <div class="eyes"><span class="eye"><b></b></span><span class="eye"><b></b></span></div>
        <div class="nose"></div>
        <div id="mouth" class="mouth mouth-0"></div>
      </div>
    </div>
    <div class="shoulders"><div class="blouse"></div><div class="vest"></div><div class="laces">╳<br>╳<br>╳</div></div>
  </div>

  <div class="languages">
    <button class="lang active" data-lang="fi-FI">Suomi</button>
    <button class="lang" data-lang="en-US">English</button>
    <button class="lang" data-lang="hu-HU">Magyar</button>
  </div>

  <textarea id="text">Hei. Tämä on iPadin oma tekstistä puheeksi -testi.</textarea>
  <button id="speak" class="primary">Puhu</button>
  <button id="think" class="secondary">Ajattele</button>
  <button id="listen" class="secondary">Kuuntele</button>
  <button id="stop" class="secondary">Pysäytä</button>
  <div id="status" class="status">Valmis.</div>
</main>
<script src="tts.js"></script>
<script src="app.js"></script>
</body>
</html>
